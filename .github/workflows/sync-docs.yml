name: Sync docs

on:
  schedule:
    # 03:17 UTC on every second day of the month; the turn of a 31-day month shortens one interval to a day.
    - cron: "17 3 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch documentation
        run: python scripts/sync_docs.py

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "Documentation is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          summary="$(git diff --cached --shortstat)"
          git commit -m "docs: sync Claude Code docs ($(date -u +%Y-%m-%d))" -m "Source: https://code.claude.com/docs/llms.txt"
          git push
          {
            echo "Synced from https://code.claude.com/docs/llms.txt"
            echo ""
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
